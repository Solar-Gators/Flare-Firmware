# =============================================================================
# Flare-Firmware CAN Bus + Radio Message Catalog
# =============================================================================
# [[message]]      - every CAN frame TRANSMITTED on a physical CAN bus.
# [[radio_packet]] - every frame the Telemetry board sends DOWN THE RADIO link.
#
# The Telemetry board bridges CAN to the RFD900x radio. It forwards can frames
# raw (keyed by their real CAN id) and also emits synthetic packets that have no
# CAN origin (GPS over I2C, radio self-diagnostics) or that repack several CAN
# frames into one (MPPT). See the [radio] section for the on-air framing.
#
# Notes:
#   * DLC == CANFrameLen (BYTES_n == n data bytes).
#   * All IDs are STANDARD (11-bit) unless id_type = "extended".
#   * Multi-byte scalar payloads are little-endian (LSB first) unless noted.
#   * Bytes not listed in a message's [[message.bytes]] are transmitted as 0.
# =============================================================================

[meta]
description = "SolarGators / University of Florida solar car CAN bus message catalog"
repos = ["Flare-Firmware", "DistributedBMS"]
boards = [
    "Front-VCU", "Rear-VCU", "Steering-Wheel", "Telemetry",       # Flare-Firmware
    "BMS-Primary", "BMS-Daughter",                                 # DistributedBMS
]
# Two physical CAN buses exist:
#   "vehicle"  - main car bus (VCUs, steering, telemetry, BMS primary)
#   "bms"      - internal BMS bus (daughter boards -> BMS secondary)
# BMS-Secondary transmits NO CAN (it forwards to BMS-Primary over UART).
# BMS-Primary has two hardware revisions; PrimaryV2 is current/active. The four
# battery frames (0x040-0x043) are byte-identical between V1 and V2; frames
# 0x044/0x045/0x180/0x181/0x190/0x192/0x1B0 are PrimaryV2-only (see per-message
# `primary_v1` flags).

