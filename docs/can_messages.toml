name       = "mitsuba_frame0"
id         = 0x08850225
sender     = "Mitsuba"
bus        = "vehicle"
dlc        = 8
id_type    = "extended"
rtr        = "data"
period_ms  = 1000
source     = "external Mitsuba motor controller (responds to 0x08F89540 request)"
trigger    = "reply to mitsuba_frame0_request"
description = "Mitsuba primary status: battery/motor voltage & current, FET temp, RPM, PWM duty, lead angle."
  [[message.bits]]
  bits  = "0-9"
  name  = "battery_voltage"
  type  = "uint10"
  scale = 0.5
  unit  = "V"
  [[message.bits]]
  bits  = "10-18"
  name  = "battery_current"
  type  = "uint9"
  scale = 1.0
  unit  = "A"
  notes = "Magnitude; sign given by battery_current_minus."
  [[message.bits]]
  bits  = "19"
  name  = "battery_current_minus"
  type  = "bool"
  notes = "1 = current flowing out of battery into MC (discharge)."
  [[message.bits]]
  bits  = "20-29"
  name  = "motor_current"
  type  = "uint10"
  scale = 1.0
  unit  = "A"
  [[message.bits]]
  bits  = "30-34"
  name  = "fet_temp"
  type  = "uint5"
  scale = 5.0
  unit  = "degC"
  [[message.bits]]
  bits  = "35-46"
  name  = "motor_rpm"
  type  = "uint12"
  scale = 1.0
  unit  = "RPM"
  [[message.bits]]
  bits  = "47-56"
  name  = "pwm_duty"
  type  = "uint10"
  scale = 0.5
  unit  = "%"
  [[message.bits]]
  bits  = "57-63"
  name  = "lead_angle"
  type  = "uint7"
  scale = 0.5
  unit  = "deg"

