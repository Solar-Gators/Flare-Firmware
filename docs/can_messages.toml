# =============================================================================
# RADIO LINK  (Telemetry board -> RFD900x -> ground station)
# =============================================================================
[radio]
board       = "Telemetry"
repo        = "Flare-Firmware"
uart        = "USART2, 57600 baud, 8N1, no flow control"
source      = "firmware/Telemetry/user/src/radio.cpp"
# On-air frame: COBS( body ) + 0x00 delimiter, where
#   body = [ id : 4 LE ][ payload_size : 2 LE ][ payload ][ crc16 : 2 LE ]
# COBS removes all 0x00 bytes from the body so a single 0x00 marks frame end.
framing     = "COBS([id:4 LE][size:2 LE][payload][crc16:2 LE]) + 0x00"
crc         = "CRC-16/CCITT-FALSE (poly 0x1021, init 0xFFFF, no reflect, xorout 0x0000)"
max_payload = 21  # bytes (max_radio_message_array_size)
tx_queue_depth = 32
# Two sources feed the radio:
#   1. Forwarded can frames  - keyed by their real CAN id (see [[message]] above).
#      The Telemetry id map handles a few frames locally; ALL other bus frames are
#      forwarded raw by a default callback. So on the radio you can see any id in
#      the [[message]] catalog that appears on the vehicle bus.
#   2. Synthetic [[radio_packet]] frames below (GPS, MPPT, radio diagnostics).
# Note: MPPT frames (0x600-0x621) are NOT forwarded raw; they are repacked into the
# MpptPacket radio_packet, which reuses the controller's base CAN id.

# -----------------------------------------------------------------------------
[[radio_packet]]
name        = "GpsPacket"
id          = 0x10000000
size        = 21
source      = "firmware/Telemetry/user/inc/telem_packets.h (TELEM_ID_GPS)"
period_ms   = 1000
origin      = "GPS over I2C (MAX-M10S); no CAN origin -> synthetic id > 0x7FF"
description = "Vehicle position, speed, and fix quality."
  [[radio_packet.bytes]]
  index = "0-7"
  name  = "latitude"
  type  = "float64 LE"
  notes = "Degrees."
  [[radio_packet.bytes]]
  index = "8-15"
  name  = "longitude"
  type  = "float64 LE"
  notes = "Degrees."
  [[radio_packet.bytes]]
  index = "16-19"
  name  = "speed"
  type  = "float32 LE"
  notes = "Ground speed."
  [[radio_packet.bytes]]
  index = 20
  name  = "num_satellites"
  type  = "uint8"

# -----------------------------------------------------------------------------
# One MpptPacket per controller. Folds the input-measurement CAN frame (base id)
# and output-measurement frame (base+1) into a single radio packet, tagged with
# the controller's base CAN id so it lines up with raw-CAN debugging.
[[radio_packet]]
name        = "MpptPacket"
id          = "0x600 / 0x610 / 0x620"
size        = 16
source      = "firmware/Telemetry/user/inc/telem_packets.h (TELEM_ID_MPPT1..3)"
period_ms   = 500
origin      = "repacked from MPPT CAN frames 0x600/0x601, 0x610/0x611, 0x620/0x621 (rate-limited)"
description = "Per-MPPT input and output voltage/current."
  [[radio_packet.bytes]]
  index = "0-3"
  name  = "input_voltage"
  type  = "float32 LE"
  [[radio_packet.bytes]]
  index = "4-7"
  name  = "input_current"
  type  = "float32 LE"
  [[radio_packet.bytes]]
  index = "8-11"
  name  = "output_voltage"
  type  = "float32 LE"
  [[radio_packet.bytes]]
  index = "12-15"
  name  = "output_current"
  type  = "float32 LE"

# -----------------------------------------------------------------------------
[[radio_packet]]
name        = "RadioStatsPacket"
id          = 0x10000001
size        = 19
source      = "firmware/Telemetry/user/inc/telem_packets.h (TELEM_ID_RADIO_STATS)"
period_ms   = 1000
origin      = "radio self-diagnostics; no CAN origin -> synthetic id > 0x7FF"
description = "Radio-link health: TX-queue occupancy, dropped-frame counts, throughput. Lets the ground station see when CAN traffic exceeds radio bandwidth."
  [[radio_packet.bytes]]
  index = "0-1"
  name  = "queue_used"
  type  = "uint16 LE"
  notes = "Messages waiting in the TX queue right now."
  [[radio_packet.bytes]]
  index = 2
  name  = "queue_capacity"
  type  = "uint8"
  notes = "TX queue depth (32)."
  [[radio_packet.bytes]]
  index = "3-4"
  name  = "queue_high_water"
  type  = "uint16 LE"
  notes = "Peak queue_used since boot; pegs at capacity when saturated."
  [[radio_packet.bytes]]
  index = "5-8"
  name  = "enqueued"
  type  = "uint32 LE"
  notes = "Total frames successfully queued since boot."
  [[radio_packet.bytes]]
  index = "9-12"
  name  = "dropped"
  type  = "uint32 LE"
  notes = "Total frames dropped because the queue was full (CAN faster than radio)."
  [[radio_packet.bytes]]
  index = "13-16"
  name  = "sent"
  type  = "uint32 LE"
  notes = "Total frames transmitted over the UART since boot."
  [[radio_packet.bytes]]
  index = "17-18"
  name  = "mean_interval_ms"
  type  = "uint16 LE"
  notes = "Mean gap between sent frames over the last ~1s window. 0 = link stalled."
