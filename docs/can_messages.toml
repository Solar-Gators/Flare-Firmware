# -----------------------------------------------------------------------------
# Mitsuba motor-controller RESPONSE frames (0x08x50225, extended 29-bit).
# The Mitsuba is an external device, not one of our boards; it answers the
# request frame above on the vehicle bus and Telemetry forwards the frames raw
# over the radio. These are BIT-PACKED, not byte-aligned: fields are described
# by `bits = "start-end"` where bit 0 is the LSB of byte 0 and bit numbering
# runs little-endian across the whole payload (int.from_bytes(payload, "little")
# then shift/mask). engineering_value = raw * scale.
# Decoders: Flare-Telemetry-Collector/app/payload_parsers.py (_parse_mitsuba_*).
# -----------------------------------------------------------------------------
[enums.MitsubaDriveAction]
STOP    = 0
FORWARD = 2
REVERSE = 3

# overheat_level, Frame2 bits 32-33
[enums.MitsubaOverheat]
NORMAL    = 0
LEVEL_1   = 1
LEVEL_2   = 2
OVER_HEAT = 3

# Frame2 error bitfield (bit index -> fault name; unlisted bits reserved)
[enums.MitsubaError]
ANALOG_SENSOR                 = 0
MOTOR_CURRENT_SENSOR_U        = 1
MOTOR_CURRENT_SENSOR_W        = 2
FET_THERMISTOR                = 3
BATTERY_VOLTAGE_SENSOR        = 5
BATTERY_CURRENT_SENSOR        = 6
BATTERY_CURRENT_SENSOR_ADJUST = 7
MOTOR_CURRENT_SENSOR_ADJUST   = 8
ACCELERATOR_POSITION          = 9
CONTROLLER_VOLTAGE_SENSOR     = 11
POWER_SYSTEM                  = 16
OVER_CURRENT                  = 17
OVER_VOLTAGE                  = 19
OVER_CURRENT_LIMIT            = 21
MOTOR_SYSTEM                  = 24
MOTOR_LOCK                    = 25
HALL_SENSOR_SHORT             = 26
HALL_SENSOR_OPEN              = 27

