# =============================================================================
# DistributedBMS  (../DistributedBMS, separate repo)
# =============================================================================
# BMS-Primary transmits onto the shared VEHICLE bus (classic CAN, 11-bit std,
# 8-byte). Telemetry consumes 0x040/0x041 from here. Multi-byte scalars in
# these frames are BIG-ENDIAN (MSB first) unless noted little-endian.
# BMS-Daughter transmits onto the internal BMS bus only.
# Two Primary HW revisions exist; PrimaryV2 is current. `primary_v1 = true`
# marks frames also emitted by the older PrimaryV1.

# BMS fault bitfield (bytes 0-1 of 0x040, big-endian; masked to 0x003F)
[enums.BmsFaults]
NONE                = 0x0000
OVERVOLTAGE         = 0x0001
UNDERVOLTAGE        = 0x0002
CELL_IMBALANCE      = 0x0004
OVERTEMPERATURE     = 0x0008
UNDERTEMPERATURE    = 0x0010
BATTERY_OVERCURRENT = 0x0020

